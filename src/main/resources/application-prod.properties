# ===== Server =====
# Render (and most PaaS) inject the port to listen on via the PORT env var
server.port=${PORT:8080}

# ===== Database =====
# Full JDBC URL is provided as one env var by most managed MySQL providers (Aiven/Railway).
# Falls back to the host/port/name pieces for local use.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:jobportal}}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

# Create/update tables automatically on the fresh hosted database
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Managed MySQL providers require TLS; the driver negotiates it when available
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

cache.jobs.ttl-minutes=5
cache.companies.ttl-minutes=5

# ===== CORS =====
# Set CORS_ALLOWED_ORIGINS to your deployed frontend URL (e.g. https://your-app.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Explicit methods/headers are required because allow-credentials is true (wildcard not permitted)
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,X-XSRF-TOKEN,X-Requested-With
app.cors.allow-credentials=true
app.cors.max-age=3600

# ===== Cross-site cookies =====
# Frontend and backend live on different domains in production, so the CSRF
# cookie is issued with SameSite=None; Secure
app.cookie.cross-site=true
